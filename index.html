<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no"/>

<title>Interactive Camera Mobile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    touch-action:none;
    font-family:monospace;
}

body{
    position:fixed;
    inset:0;
}

video,
canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

video{
    object-fit:cover;
    transform:scaleX(-1);
    filter:
    contrast(1.05)
    saturate(1.05)
    brightness(0.95);
}

canvas{
    pointer-events:none;
}

.controls{
    position:absolute;
    z-index:20;
    top:env(safe-area-inset-top,20px);
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    padding-top:12px;
}

button{
    border:none;
    outline:none;
    padding:12px 18px;
    border-radius:999px;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(10px);
    color:white;
    font-size:14px;
    letter-spacing:1px;
    border:1px solid rgba(255,255,255,0.15);
}

</style>
</head>
<body>

<div class="controls">
    <button id="switchCam">
        CAMBIAR CAMARA
    </button>
</div>

<video
id="video"
autoplay
playsinline
muted
></video>

<canvas id="canvas"></canvas>

<script>

//////////////////////////////////////////////////////
// ELEMENTOS
//////////////////////////////////////////////////////

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext(
    "2d",
    { alpha:true }
);

//////////////////////////////////////////////////////
// RESIZE MOBILE
//////////////////////////////////////////////////////

function resizeCanvas(){

    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

//////////////////////////////////////////////////////
// CAMARA
//////////////////////////////////////////////////////

let currentFacing = "user";
let currentStream = null;

async function iniciarCamara(){

    try{

        if(currentStream){

            currentStream
            .getTracks()
            .forEach(track=>track.stop());
        }

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:currentFacing
                },
                width:{
                    ideal:640
                },
                height:{
                    ideal:1280
                },
                frameRate:{
                    ideal:24,
                    max:30
                }
            },

            audio:false
        });

        currentStream = stream;

        video.srcObject = stream;

        if(currentFacing === "user"){

            video.style.transform =
            "scaleX(-1)";
        }
        else{

            video.style.transform =
            "scaleX(1)";
        }

    }catch(err){

        alert(
        "No se pudo acceder a la cámara"
        );

        console.error(err);
    }
}

iniciarCamara();

//////////////////////////////////////////////////////
// CAMBIO DE CAMARA
//////////////////////////////////////////////////////

document
.getElementById("switchCam")
.addEventListener("click",()=>{

    currentFacing =
    currentFacing === "user"
    ? "environment"
    : "user";

    iniciarCamara();
});

//////////////////////////////////////////////////////
// BUFFER PEQUEÑO = MAS RAPIDO
//////////////////////////////////////////////////////

const buffer =
document.createElement("canvas");

const btx =
buffer.getContext("2d",{
    willReadFrequently:true
});

buffer.width = 80;
buffer.height = 140;

let previousFrame = null;

let motionPoints = [];

//////////////////////////////////////////////////////
// DETECCION DE MOVIMIENTO
//////////////////////////////////////////////////////

function detectarMovimiento(){

    if(video.readyState < 2) return;

    btx.drawImage(
        video,
        0,
        0,
        buffer.width,
        buffer.height
    );

    const frame =
    btx.getImageData(
        0,
        0,
        buffer.width,
        buffer.height
    );

    if(previousFrame){

        motionPoints.length = 0;

        for(
            let i=0;
            i<frame.data.length;
            i+=32
        ){

            const r = frame.data[i];
            const g = frame.data[i+1];
            const b = frame.data[i+2];

            const pr =
            previousFrame.data[i];

            const pg =
            previousFrame.data[i+1];

            const pb =
            previousFrame.data[i+2];

            const diff =
            Math.abs(r-pr)+
            Math.abs(g-pg)+
            Math.abs(b-pb);

            if(diff > 150){

                const pixel = i/4;

                const x =
                (pixel % buffer.width)
                * (innerWidth / buffer.width);

                const y =
                Math.floor(
                    pixel / buffer.width
                )
                * (innerHeight / buffer.height);

                motionPoints.push({x,y});

                crearExplosion(x,y);
            }
        }
    }

    previousFrame = frame;
}

//////////////////////////////////////////////////////
// PARTICULAS MINIMAL
//////////////////////////////////////////////////////

let particulas = [];

class Particula{

    constructor(x,y){

        this.x = x;
        this.y = y;

        this.vx =
        (Math.random()-0.5)*1.5;

        this.vy =
        (Math.random()-0.5)*1.5;

        this.size =
        Math.random()*4+1;

        this.life = 80;

        this.hue =
        180 + Math.random()*80;
    }

    update(){

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.985;
        this.vy *= 0.985;

        this.life--;
    }

    draw(){

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        `hsla(
            ${this.hue},
            100%,
            70%,
            ${this.life/500}
        )`;

        ctx.shadowBlur = 6;

        ctx.shadowColor =
        `hsl(
            ${this.hue},
            100%,
            70%
        )`;

        ctx.fill();
    }
}

function crearExplosion(x,y){

    for(let i=0;i<1;i++){

        particulas.push(
            new Particula(x,y)
        );
    }

    // LIMITE PARA CELULAR
    if(particulas.length > 120){

        particulas.splice(
            0,
            particulas.length - 120
        );
    }
}

//////////////////////////////////////////////////////
// DEGRADE REACTIVO
//////////////////////////////////////////////////////

function drawGradient(){

    for(
        let i=0;
        i<motionPoints.length;
        i+=4
    ){

        const point =
        motionPoints[i];

        const gradient =
        ctx.createRadialGradient(
            point.x,
            point.y,
            0,
            point.x,
            point.y,
            120
        );

        gradient.addColorStop(
            0,
            "rgba(0,255,255,0.05)"
        );

        gradient.addColorStop(
            0.5,
            "rgba(255,0,255,0.03)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            point.x - 120,
            point.y - 120,
            240,
            240
        );
    }
}

//////////////////////////////////////////////////////
// TOUCH INTERACTION
//////////////////////////////////////////////////////

window.addEventListener(
    "touchmove",
    e=>{

        for(
            let touch of e.touches
        ){

            crearExplosion(
                touch.clientX,
                touch.clientY
            );
        }
    },
    { passive:true }
);

//////////////////////////////////////////////////////
// LOOP OPTIMIZADO
//////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    detectarMovimiento();

    ctx.fillStyle =
    "rgba(0,0,0,0.08)";

    ctx.fillRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    drawGradient();

    for(
        let i=particulas.length-1;
        i>=0;
        i--
    ){

        const p = particulas[i];

        p.update();
        p.draw();

        if(p.life <= 0){

            particulas.splice(i,1);
        }
    }
}

animate();

</script>

</body>
</html>
