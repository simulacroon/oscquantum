<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Observaciones Ultrasónicas</title>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    touch-action:none;
}

button{

    position:absolute;

    z-index:20;

    top:20px;
    left:20px;

    padding:12px 16px;

    background:black;
    color:white;

    border:1px solid white;

    font-family:monospace;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<button id="switchCam">
CAMBIAR CAMARA
</button>

<script>

let video;

let prevFrame;

let feedback;

let particles = [];

let threshold = 40;

let currentFacing = "environment";

async function setupCamera(){

    if(video && video.elt.srcObject){

        video.elt.srcObject
        .getTracks()
        .forEach(track => track.stop());
    }

    video = createCapture({

        video:{
            facingMode:currentFacing
        },

        audio:false

    });

    video.size(160,120);

    video.hide();
}

function setup(){

    createCanvas(windowWidth,windowHeight);

    pixelDensity(1);

    feedback = createGraphics(
        windowWidth,
        windowHeight
    );

    setupCamera();

    background(0);
}

document
.getElementById("switchCam")
.onclick = async ()=>{

    currentFacing =
        currentFacing === "user"
        ? "environment"
        : "user";

    await setupCamera();
};

function draw(){

    background(0);

    // CAMARA BASE

    push();

    tint(255,60);

    translate(width,0);

    scale(-1,1);

    image(video,0,0,width,height);

    pop();

    // FEEDBACK SUAVE

    feedback.push();

    feedback.translate(width/2,height/2);

    feedback.scale(1.003);

    feedback.tint(255,245);

    feedback.image(

        feedback,

        -width/2,

        -height/2,

        width,

        height
    );

    feedback.pop();

    // DESVANECER

    feedback.noStroke();

    feedback.fill(0,20);

    feedback.rect(
        0,
        0,
        width,
        height
    );

    if(video.loadedmetadata){

        video.loadPixels();

        if(prevFrame){

            prevFrame.loadPixels();

            for(let y=0;y<video.height;y+=5){

                for(let x=0;x<video.width;x+=5){

                    let index =
                        (x + y * video.width) * 4;

                    let r1 = video.pixels[index];
                    let g1 = video.pixels[index+1];
                    let b1 = video.pixels[index+2];

                    let r2 = prevFrame.pixels[index];
                    let g2 = prevFrame.pixels[index+1];
                    let b2 = prevFrame.pixels[index+2];

                    let diff =

                        abs(r1-r2) +

                        abs(g1-g2) +

                        abs(b1-b2);

                    if(diff > threshold){

                        let px = map(
                            x,
                            0,
                            video.width,
                            width,
                            0
                        );

                        let py = map(
                            y,
                            0,
                            video.height,
                            0,
                            height
                        );

                        particles.push(
                            new Particle(
                                px,
                                py,
                                diff
                            )
                        );
                    }
                }
            }
        }

        prevFrame = video.get();
    }

    feedback.blendMode(SCREEN);

    for(let i=particles.length-1;i>=0;i--){

        particles[i].update();

        particles[i].display(feedback);

        if(particles[i].life <= 0){

            particles.splice(i,1);
        }
    }

    drawGradientFog();

    image(feedback,0,0);

    drawScanner();
}

class Particle{

    constructor(x,y,e){

        this.x = x;

        this.y = y;

        this.energy = e;

        this.life = 255;

        this.size = random(40,120);

        this.vx = random(-0.3,0.3);

        this.vy = random(-0.3,0.3);
    }

    update(){

        this.x += this.vx;

        this.y += this.vy;

        this.life -= 3;
    }

    display(g){

        g.noStroke();

        let heat = map(
            this.energy,
            40,
            255,
            0,
            1
        );

        let r = lerp(0,255,heat);

        let gg = lerp(80,180,heat);

        let b = lerp(255,50,heat);

        g.fill(

            r,

            gg,

            b,

            this.life * 0.03
        );

        g.ellipse(
            this.x,
            this.y,
            this.size
        );
    }
}

function drawGradientFog(){

    for(let i=0;i<3;i++){

        let x =
            noise(frameCount*0.002+i)
            * width;

        let y =
            noise(frameCount*0.002+i+100)
            * height;

        let s =
            noise(frameCount*0.003+i)
            * 600 + 200;

        feedback.noStroke();

        feedback.fill(

            50,

            120,

            255,

            8
        );

        feedback.ellipse(
            x,
            y,
            s
        );
    }
}

function drawScanner(){

    blendMode(SCREEN);

    for(let y=0;y<height;y+=45){

        let alpha = map(

            sin(
                frameCount*0.02
                + y*0.01
            ),

            -1,
            1,

            5,
            30
        );

        stroke(

            100,

            180,

            255,

            alpha
        );

        line(
            0,
            y,
            width,
            y
        );
    }
}

function windowResized(){

    resizeCanvas(
        windowWidth,
        windowHeight
    );

    feedback = createGraphics(
        windowWidth,
        windowHeight
    );
}

</script>

</body>
</html>
