<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Observaciones Ultrasónicas</title>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<script>

let video;

let prevFrame;
let threshold = 40;

let particles = [];

function setup(){

    createCanvas(windowWidth, windowHeight);

    pixelDensity(1);

    video = createCapture({

        video:{
            facingMode:"environment"
        },

        audio:false
    });

    video.size(160,120);

    video.hide();

    background(0);
}

function draw(){

    background(0,20);

    video.loadPixels();

    if(prevFrame){

        prevFrame.loadPixels();

        for(let y=0;y<video.height;y+=4){

            for(let x=0;x<video.width;x+=4){

                let index = (x + y * video.width) * 4;

                let r1 = video.pixels[index];
                let g1 = video.pixels[index+1];
                let b1 = video.pixels[index+2];

                let r2 = prevFrame.pixels[index];
                let g2 = prevFrame.pixels[index+1];
                let b2 = prevFrame.pixels[index+2];

                let diff =
                    abs(r1-r2) +
                    abs(g1-g2) +
                    abs(b1-b2);

                if(diff > threshold){

                    let px = map(x,0,video.width,0,width);
                    let py = map(y,0,video.height,0,height);

                    particles.push(new Particle(px,py,diff));
                }
            }
        }
    }

    prevFrame = video.get();

    blendMode(ADD);

    for(let i=particles.length-1;i>=0;i--){

        particles[i].update();
        particles[i].display();

        if(particles[i].life <= 0){

            particles.splice(i,1);
        }
    }

    drawScanner();
}

class Particle{

    constructor(x,y,e){

        this.x = x;
        this.y = y;

        this.energy = e;

        this.life = 255;

        this.size = random(20,80);

        this.vx = random(-1,1);
        this.vy = random(-1,1);
    }

    update(){

        this.x += this.vx;
        this.y += this.vy;

        this.life -= 4;
    }

    display(){

        noStroke();

        let heat = map(this.energy,40,255,0,1);

        let r = lerp(0,255,heat);
        let g = lerp(100,180,heat);
        let b = lerp(255,0,heat);

        fill(r,g,b,this.life*0.15);

        ellipse(this.x,this.y,this.size);
    }
}

function drawScanner(){

    strokeWeight(2);

    for(let y=0;y<height;y+=40){

        let alpha = map(sin(frameCount*0.02 + y*0.01),-1,1,20,80);

        stroke(100,180,255,alpha);

        line(0,y,width,y);
    }
}

function windowResized(){

    resizeCanvas(windowWidth,windowHeight);
}

</script>

</body>
</html>
